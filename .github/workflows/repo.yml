name: Update Sileo repository

on:
  push:
    branches: [main]
    paths:
      - 'debs/**'
      - 'build_repo.py'
      - 'index.html'
      - 'CydiaIcon.png'
      - 'flag2.png'
      - 'bg_news.jpg'
      - 'icons/**'
      - '.github/workflows/repo.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

concurrency:
  group: sileo-yue-yu-yuan
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build package index
        run: python3 build_repo.py

      - name: Commit updated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Packages Packages.gz Packages.bz2 Release
          if ! git diff --cached --quiet; then
            git commit -m "Update package index"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
